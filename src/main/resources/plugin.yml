name: GeoRestrict
main: zip.linuxaddict.georestrict.bukkit.GeoRestrictBukkitPlugin
version: 2.1.0
api-version: '1.16'
folia-supported: true
softdepend: [Geyser-Spigot, floodgate]

load: STARTUP
description: Geographic restriction plugin for Minecraft servers
author: Demonz Development
website: https://demonz.org/
commands:
  georestrict:
    description: Main GeoRestrict command
    usage: /georestrict <check|purgecache|cachestats|reload>
    permission: georestrict.admin
permissions:
  georestrict.admin:
    description: Full access to GeoRestrict commands
    default: op
  georestrict.bypass:
    description: Skip geographic checks on Bukkit-compatible backend servers
    default: false
