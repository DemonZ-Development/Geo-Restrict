[package]
name = "georestrict-pumpkin"
version = "2.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Native Java and Bedrock geographic admission for Pumpkin"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
url = "2.5"

[target.'cfg(target_arch = "wasm32")'.dependencies]
pumpkin-plugin-api = "=0.2.0+26.3-26.51"
waki = "=0.5.1"

[profile.release]
opt-level = "s"
lto = true
strip = true
