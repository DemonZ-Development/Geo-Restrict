name: Release version tag

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/build.yml
    with:
      release_tag: ${{ github.ref_name }}

  publish:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-input
      - name: Assemble release assets and checksums
        run: |
          mkdir -p dist
          find release-input -type f \( -name '*.jar' -o -name '*.wasm' \) -exec cp {} dist/ \;
          cp LICENSE CHANGELOG.md dist/
          cd dist
          sha256sum * > SHA256SUMS
      - name: Stage assets and publish the completed release
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          existing=$(gh release list --limit 100 --json tagName,isDraft --jq ".[] | select(.tagName == \"$RELEASE_TAG\") | .isDraft")
          if [ -z "$existing" ]; then
            gh release create "$RELEASE_TAG" --verify-tag --title "GeoRestrict $RELEASE_TAG" --notes "Release $RELEASE_TAG"
          fi
          mapfile -t assets < <(find dist -maxdepth 1 -type f -print | sort)
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
